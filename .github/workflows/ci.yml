name: NIRMIQ CI

on:
  push:
    branches:
      - main
      - v3-foundation
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Backend tests and web build
    runs-on: windows-latest
    env:
      PYTHONPATH: apps/api
      USE_OLLAMA_GENERATION: "false"
      USE_OLLAMA_EMBEDDINGS: "false"
      USE_OLLAMA_RERANKER: "false"
      LOW_MEMORY_MODE: "true"
      SECURITY_ALLOW_ARBITRARY_LOCAL_PATHS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install OCR runtime
        run: choco install tesseract --version=5.5.0.20241111 --yes --no-progress

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "apps/api[ocr]"

      - name: Backend tests
        shell: pwsh
        run: ./scripts/test_api.ps1

      - name: Compile backend
        run: python -m compileall apps/api/app

      - name: Hard-document offline evaluation
        run: npm.cmd run eval:hard-docs

      - name: Recursive-summary reliability evaluation
        run: npm.cmd run eval:summary-reliability

      - name: Retain recursive-summary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recursive-summary-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: data/processed/eval/recursive_summary_reliability_metrics.json

      - name: Retain hard-document evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hard-document-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            data/processed/eval/hard_document_metrics.json
            data/processed/eval/hard_document_pipeline_report.json
            data/processed/eval/hard_document_failures.jsonl
            temp/hard-document-fixtures/manifest.json

      - name: Install frontend
        working-directory: apps/web
        run: npm.cmd ci

      - name: Release doctor
        run: npm.cmd run doctor

      - name: Build frontend
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:8000
        run: npm.cmd run build

      - name: Validate Docker Compose config
        run: docker compose -f docker-compose.local.yml config

  linux-smoke:
    name: Linux browser-mode offline smoke
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: apps/api
      USE_OLLAMA_GENERATION: "false"
      USE_OLLAMA_EMBEDDINGS: "false"
      USE_OLLAMA_RERANKER: "false"
      RETRIEVAL_ENABLE_VECTOR: "false"
      LOW_MEMORY_MODE: "true"
      SECURITY_ALLOW_ARBITRARY_LOCAL_PATHS: "true"
      NIRMIQ_RUNTIME_PROFILE: cpu_offline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e apps/api

      - name: Compile backend
        run: python -m compileall apps/api/app

      - name: Check Linux script syntax
        run: bash -n scripts/linux_ci_smoke.sh

      - name: Install frontend
        working-directory: apps/web
        run: npm ci

      - name: Build frontend on Linux
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:8015
        run: npm run build

      - name: Offline API and BM25 smoke
        run: bash scripts/linux_ci_smoke.sh

      - name: Retain Linux smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-smoke-logs-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: temp/linux-ci-smoke/*.log
