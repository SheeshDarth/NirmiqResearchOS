name: Bug Report
description: Report a reproducible issue in the local NIRMIQ app.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: Keep this local and remove private document text or paths.
      placeholder: |
        1. Start the app with ...
        2. Upload/select ...
        3. Ask ...
        4. See ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Startup / install
        - Upload / ingestion
        - Retrieval / answer quality
        - Citations / evidence trail
        - UI / layout
        - Paper Lab
        - Exam Lab
        - Privacy / local data controls
        - Desktop app
        - Linux browser mode
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Local Checks
      description: Paste safe summaries only. Do not paste raw document text or private paths.
      placeholder: |
        npm.cmd run doctor
        npm.cmd run diagnostics
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy Check
      options:
        - label: I removed private document text, filenames, full local paths, API keys, and raw logs.
          required: true
