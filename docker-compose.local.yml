services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    working_dir: /workspace/apps/api
    volumes:
      - ./:/workspace
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      WEB_ALLOWED_ORIGINS: http://127.0.0.1:3002,http://localhost:3002
      USE_OLLAMA_GENERATION: "false"
      USE_OLLAMA_EMBEDDINGS: "false"
      USE_OLLAMA_RERANKER: "false"
      LOW_MEMORY_MODE: "true"
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    working_dir: /workspace/apps/web
    volumes:
      - ./:/workspace
      - web_node_modules:/workspace/apps/web/node_modules
    environment:
      NEXT_PUBLIC_API_BASE: http://127.0.0.1:8000
    ports:
      - "3002:3002"
    depends_on:
      - api

volumes:
  web_node_modules:
