services:
  api:
    image: python:3.12-slim
    working_dir: /workspace/apps/api
    volumes:
      - ./:/workspace
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      WEB_ALLOWED_ORIGINS: http://127.0.0.1:3002,http://localhost:3002
      USE_OLLAMA_GENERATION: "false"
      USE_OLLAMA_EMBEDDINGS: "false"
      USE_OLLAMA_RERANKER: "false"
      LOW_MEMORY_MODE: "true"
    command: >
      sh -c "python -m pip install -e . &&
      python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  web:
    image: node:22-alpine
    working_dir: /workspace/apps/web
    volumes:
      - ./:/workspace
    environment:
      NEXT_PUBLIC_API_BASE: http://127.0.0.1:8000
    command: >
      sh -c "npm install &&
      npm run dev"
    ports:
      - "3002:3002"
    depends_on:
      - api
